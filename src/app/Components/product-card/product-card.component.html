<div class="product-card">
  <div class="card-image">
    <img [src]="product.image || 'assets/default-product.png'" [alt]="product.title">
  </div>

  <div class="card-body">
    <h3 class="product-title">{{ product.title }}</h3>
    <p class="product-category">{{ product.category }}</p>

    <div class="product-price">
      {{ product.price | currency:'USD':'symbol':'1.2-2' }}
      <span *ngIf="product.quantity > 0" class="stock-badge">
        {{ product.quantity }} en stock
      </span>
      <span *ngIf="product.quantity === 0" class="stock-badge out-of-stock">
        Agotado
      </span>
    </div>

    <p class="product-description">{{ product.description | truncate:20 }}</p>

    <div *ngIf="showActions" class="card-actions">
      <button
        class="btn-cart"
        (click)="addToCart()"
        [disabled]="product.quantity == 0">
        <i class="fas fa-cart-plus"></i> Añadir
      </button>
    </div>
  </div>
</div>
